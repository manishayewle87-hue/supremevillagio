name: "Ultra-Advanced SEO Automation"

on:
  push:
    branches:
      - main
  schedule:
    # Run automatically every 3 days at midnight UTC to force recrawls
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  seo_indexing:
    name: "Push APIs (IndexNow & Google Indexing)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm install

      - name: Execute IndexNow API Request (Bing, Yandex, Seznam)
        run: node scripts/indexnow-submit.js
        
      - name: Execute Google Indexing API Request (Googlebot)
        env:
          GOOGLE_API_CREDENTIALS: ${{ secrets.GOOGLE_API_CREDENTIALS }}
        run: node scripts/google-index.js
